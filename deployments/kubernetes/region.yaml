apiVersion: apps/v1
kind: Deployment
metadata:
  name: region-beijing
  namespace: jzse
  labels:
    app.kubernetes.io/name: region
    app.kubernetes.io/instance: region-beijing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: region
      app.kubernetes.io/instance: region-beijing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: region
        app.kubernetes.io/instance: region-beijing
    spec:
      containers:
        - name: region
          image: jzse-region:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 9090
              protocol: TCP
          env:
            - name: JzSE_REGION_ID
              value: "region-beijing"
            - name: JzSE_REGION_NAME
              value: "Beijing Region"
            - name: JzSE_REGION_LOCATION
              value: "beijing"
            - name: JzSE_COORDINATOR_ENDPOINTS
              value: "coordinator.jzse.svc.cluster.local:8081"
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: region-config
        - name: data
          persistentVolumeClaim:
            claimName: region-beijing-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: region-beijing-data
  namespace: jzse
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: region-beijing
  namespace: jzse
  labels:
    app.kubernetes.io/name: region
    app.kubernetes.io/instance: region-beijing
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
  selector:
    app.kubernetes.io/name: region
    app.kubernetes.io/instance: region-beijing
