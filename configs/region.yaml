# Region Service Configuration

server:
  http_addr: ":8080"
  grpc_addr: ":9090"
  read_timeout: 30s
  write_timeout: 30s

region:
  id: "region-beijing"
  name: "Beijing Region"
  location: "beijing"

coordinator:
  url: "http://localhost:8081"
  endpoints:
    - "localhost:2379"
  dial_timeout: 5s

storage:
  # 推荐后端: minio
  # 可选值: minio | s3 | rustfs | local_fs
  # 多 Region 部署时请为每个 Region 使用独立的 endpoint / bucket / 凭据
  backend: "minio"
  # 仅在 backend=local_fs 时生效
  path: "./data/storage"
  temp_path: "./data/temp"
  minio:
    # backend=minio 时使用以下配置
    endpoint: "localhost:9000"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket: "jzse"
    region: "us-east-1"
    use_ssl: false
    prefix: ""
  s3:
    # backend=s3 时使用以下配置
    endpoint: "s3.amazonaws.com"
    access_key: ""
    secret_key: ""
    bucket: "jzse"
    region: "us-east-1"
    use_ssl: true
    prefix: ""
  rustfs:
    # backend=rustfs 时使用以下配置
    endpoint: "localhost:9000"
    access_key: ""
    secret_key: ""
    bucket: "jzse"
    region: "us-east-1"
    use_ssl: false
    prefix: ""

metadata:
  # 多 Region 部署时请为每个 Region 使用独立 db_path
  db_path: "./data/metadata"
  cache_size: "256MB"

sync:
  mode: "push"
  batch_size: 100
  batch_interval: 5s
  retry_interval: 30s
  max_retries: 10

logger:
  level: "info"
  format: "json"
  output: "stdout"
  development: false
